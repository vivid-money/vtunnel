name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ts/ as @vivid-money/vtunnel on GitHub Packages, versioned by the tag:
  # v1.2.3 → 1.2.3 on dist-tag latest; v1.2.3-beta.4 → 1.2.3-beta.4 on dist-tag
  # beta (the prerelease's name), so a prerelease never becomes what a plain
  # install resolves to. The repository keeps version 0.0.0.
  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@vivid-money"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) dist_tag="${version#*-}"; dist_tag="${dist_tag%%.*}" ;;
            *) dist_tag=latest ;;
          esac
          npm version --no-git-tag-version "$version"
          npm publish --tag "$dist_tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
