name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ts/ as an npm package attached to the same GitHub release, versioned by the
  # tag (v1.2.3-beta.4 → 1.2.3-beta.4; ts/package.json keeps 0.0.0). Public and
  # tokenless, unlike a registry: a consumer depends on the asset's URL,
  #   "@vivid-money/vtunnel": "https://github.com/vivid-money/vtunnel/releases/download/v1.2.3/vivid-money-vtunnel-1.2.3.tgz"
  # After GoReleaser, which creates the release.
  npm:
    needs: goreleaser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Pack and attach to the release
        run: |
          npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" "$(npm pack --silent)"
        env:
          GH_TOKEN: ${{ github.token }}
